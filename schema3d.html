<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ДСК — интерактивная 3D-схема линии</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f2ec; --ink:#17181a; --muted:#6d6a61; --accent:#f2c11b;
    --panel:#ffffff; --line:#d9d4c8;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:'Golos Text',sans-serif; background:var(--bg); color:var(--ink);
    overflow:hidden;
  }
  #scene{position:fixed;inset:0}
  #scene canvas{display:block;touch-action:none}

  .hud-top{
    position:fixed;top:0;left:0;right:0;padding:20px 24px;pointer-events:none;
    display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
  }
  .hud-top h1{
    font-family:'Oswald',sans-serif;font-weight:600;font-size:clamp(20px,3vw,30px);
    text-transform:uppercase;letter-spacing:.02em;line-height:1.05;
  }
  .hud-top .sub{color:var(--muted);font-size:13px;margin-top:6px;max-width:420px}
  .hud-top .badge{
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
    border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:rgba(255,255,255,.6);
    white-space:nowrap;margin-top:4px;
  }

  .hud-bottom{
    position:fixed;left:0;right:0;bottom:0;padding:14px 24px;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    background:linear-gradient(transparent,rgba(244,242,236,.94) 45%);
    justify-content: center; /* Центрируем ползунок */
  }
  .hud-bottom .slider-wrap{
    display:flex;align-items:center;gap:12px;flex:1;min-width:230px;max-width:480px;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 16px;
    box-shadow:0 6px 24px rgba(23,24,26,.08);
    margin: 0 auto; /* Дополнительное центрирование */
  }
  .hud-bottom .slider-wrap .cap{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);white-space:nowrap}
  input[type=range]{
    -webkit-appearance:none;appearance:none;flex:1;height:4px;border-radius:4px;
    background:linear-gradient(90deg,var(--accent) var(--fill,0%),#e6e2d8 var(--fill,0%));
    outline:none;cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--ink);
    border:4px solid var(--accent);cursor:grab;
  }
  input[type=range]::-moz-range-thumb{
    width:14px;height:14px;border-radius:50%;background:var(--ink);border:4px solid var(--accent);cursor:grab;
  }

  #tags{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .tag{
    position:absolute;transform:translate(-50%,-100%);
    background:rgba(255,255,255,.92);border:1px solid var(--line);border-left:3px solid var(--accent);
    border-radius:8px;padding:7px 10px;white-space:nowrap;
    box-shadow:0 4px 14px rgba(23,24,26,.10);
    opacity:0;transition:opacity .25s;will-change:transform;
  }
  .tag b{font-family:'Oswald',sans-serif;font-weight:500;font-size:13px;letter-spacing:.02em;display:block}
  .tag span{font-size:11px;color:var(--muted);display:block;margin-top:1px}

  #info{
    position:fixed;left:24px;bottom:86px;max-width:300px;
    background:var(--ink);color:#f5f4f0;border-radius:12px;padding:16px 18px;
    box-shadow:0 10px 30px rgba(23,24,26,.25);
    opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none;
  }
  #info.show{opacity:1;transform:none}
  #info h3{font-family:'Oswald',sans-serif;font-weight:500;font-size:16px;letter-spacing:.03em;text-transform:uppercase;color:var(--accent)}
  #info p{font-size:13px;line-height:1.45;margin-top:6px;color:#d8d6cf}
  #info .close{position:absolute;top:8px;right:10px;font-size:15px;cursor:pointer;color:#8b8a85}

  .hint{
    position:fixed;right:24px;bottom:86px;font-size:11px;color:var(--muted);text-align:right;
    pointer-events:none;line-height:1.5;
  }

  @media (max-width:640px){
    .hud-top{padding:14px 16px}
    .hud-top .badge{display:none}
    .hud-bottom{padding:10px 12px;gap:8px}
    .hud-bottom .slider-wrap{min-width:100%;order:-1}
    .hint{display:none}
    .tag b{font-size:11px}.tag span{font-size:10px}
    #info{left:12px;right:12px;max-width:none;bottom:90px} /* Подняли выше, так как кнопок больше нет */
  }
</style>
</head>
<body>
<div id="scene"></div>

<header class="hud-top">
  <div>
    <h1>Линия ДСК — 3D</h1>
    <p class="sub">Крутите схему, тяните ползунок — линия разбирается на узлы. Клик по узлу — описание.</p>
  </div>
  <span class="badge">250 т/ч · гранит · фракция 5–20</span>
</header>

<div id="tags"></div>

<aside id="info" aria-live="polite">
  <span class="close" id="infoClose">×</span>
  <h3 id="infoTitle"></h3>
  <p id="infoText"></p>
</aside>

<p class="hint">Тяните — вращение · колесо — масштаб<br>Схема иллюстративная: точный состав считает инженер</p>

<div class="hud-bottom">
  <div class="slider-wrap">
    <span class="cap">Собрано</span>
    <input id="explode" type="range" min="0" max="100" value="100" aria-label="Разбор линии на узлы">
    <span class="cap">Разобрано</span>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "./libs/three.module.js",
    "three/addons/OrbitControls.js": "./libs/OrbitControls.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/OrbitControls.js';

/* ---------- базовая сцена ---------- */
const BG = 0xf4f2ec;
const container = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(BG);
scene.fog = new THREE.Fog(BG, 34, 62);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 200);
camera.position.set(11, 9.5, 17);

/* адаптивная оптика: на узких экранах шире угол и дальше камера */
function baseCameraPos() {
  const a = innerWidth / innerHeight;
  const s = a < 0.9 ? 1.32 : a < 1.25 ? 1.12 : 1;
  return new THREE.Vector3(12.5 * s, 10.5 * Math.min(s, 1.12), 19 * s);
}
function fitCamera() {
  const a = innerWidth / innerHeight;
  camera.fov = a < 0.9 ? 58 : a < 1.25 ? 50 : 45;
  camera.updateProjectionMatrix();
}
camera.position.copy(baseCameraPos());
fitCamera();

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(1.2, 2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI / 2 - 0.04;
controls.minDistance = 8;
controls.maxDistance = 42;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.9;

/* ---------- свет ---------- */
scene.add(new THREE.HemisphereLight(0xffffff, 0xcfc9ba, 1.05));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(14, 20, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -24; sun.shadow.camera.right = 24;
sun.shadow.camera.top = 24; sun.shadow.camera.bottom = -24;
sun.shadow.bias = -0.0004;
scene.add(sun);

/* ---------- пол ---------- */
const floor = new THREE.Mesh(
  new THREE.CircleGeometry(34, 64),
  new THREE.MeshStandardMaterial({ color: 0xe9e5da, roughness: 1 })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);
const ring = new THREE.Mesh(
  new THREE.RingGeometry(16.6, 16.72, 128),
  new THREE.MeshBasicMaterial({ color: 0x17181a, transparent: true, opacity: 0.14 })
);
ring.rotation.x = -Math.PI / 2;
ring.position.y = 0.01;
scene.add(ring);

/* ---------- материалы ---------- */
const M = {
  steel:  new THREE.MeshStandardMaterial({ color: 0x66788a, roughness: 0.55, metalness: 0.25 }),
  dark:   new THREE.MeshStandardMaterial({ color: 0x2c3136, roughness: 0.6, metalness: 0.2 }),
  yellow: new THREE.MeshStandardMaterial({ color: 0xf2c11b, roughness: 0.5, metalness: 0.05 }),
  stone:  new THREE.MeshStandardMaterial({ color: 0x8f887b, roughness: 1 }),
  belt:   new THREE.MeshStandardMaterial({ color: 0x3a3d42, roughness: 0.9 }),
};
const box = (w, h, d, m) => { const g = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); g.castShadow = true; g.receiveShadow = true; return g; };
const cyl = (r1, r2, h, m, seg = 20) => { const g = new THREE.Mesh(new THREE.CylinderGeometry(r1, r2, h, seg), m); g.castShadow = true; return g; };

/* ---------- узлы линии ---------- */
const nodes = [];
function addNode(group, base, off, label, spec, text) {
  group.position.copy(base);
  scene.add(group);
  const n = { group, base, off, label, spec, text, meshes: [] };
  group.traverse(o => { if (o.isMesh) { n.meshes.push(o); o.userData.node = n; } });
  nodes.push(n);
  return n;
}

/* приёмный бункер + вибропитатель */
function makeHopper() {
  const g = new THREE.Group();
  for (const [x, z] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
    const leg = box(0.14, 1.5, 0.14, M.dark); leg.position.set(x * 0.85, 0.75, z * 0.85); g.add(leg);
  }
  const body = cyl(1.7, 0.5, 1.9, M.steel, 4);
  body.rotation.y = Math.PI / 4; body.position.y = 2.35; g.add(body);
  const rim = cyl(1.75, 1.75, 0.16, M.dark, 4); rim.rotation.y = Math.PI / 4; rim.position.y = 3.28; g.add(rim);
  const chute = box(0.8, 0.9, 0.8, M.dark); chute.position.set(0, 1.35, 0.55); g.add(chute);
  const feeder = box(1.1, 0.5, 2.2, M.yellow); feeder.position.set(0, 0.8, 1.15); g.add(feeder);
  return g;
}

/* щековая дробилка */
function makeJaw() {
  const g = new THREE.Group();
  g.add(box(2.4, 0.55, 2.0, M.dark)).children.at(-1).position.y = 0.28;
  const body = box(2.0, 1.7, 1.5, M.steel); body.position.y = 1.55; g.add(body);
  const inlet = box(1.6, 0.55, 1.1, M.dark); inlet.position.y = 2.65; g.add(inlet);
  for (const s of [-1, 1]) {
    const fly = cyl(0.8, 0.8, 0.26, M.dark); fly.rotation.x = Math.PI / 2;
    fly.position.set(0, 1.15, s * 0.95); g.add(fly);
    const hub = cyl(0.18, 0.18, 0.34, M.yellow); hub.rotation.x = Math.PI / 2;
    hub.position.set(0, 1.15, s * 0.95); g.add(hub);
  }
  const stripe = box(2.02, 0.22, 1.52, M.yellow); stripe.position.y = 0.95; g.add(stripe);
  return g;
}

/* конусная дробилка */
function makeCone() {
  const g = new THREE.Group();
  g.add(box(2.3, 0.55, 2.1, M.dark)).children.at(-1).position.y = 0.28;
  const housing = cyl(0.85, 1.15, 1.9, M.steel); housing.position.y = 1.85; g.add(housing);
  const cap = cyl(0.55, 0.85, 0.55, M.dark); cap.position.y = 3.05; g.add(cap);
  const pulley = cyl(0.55, 0.55, 0.22, M.dark); pulley.rotation.x = Math.PI / 2;
  pulley.position.set(0, 1.3, 1.15); g.add(pulley);
  const stripe = cyl(1.16, 1.16, 0.2, M.yellow); stripe.position.y = 1.05; g.add(stripe);
  return g;
}

/* виброгрохот */
function makeScreen() {
  const g = new THREE.Group();
  const deck = new THREE.Group();
  for (let i = 0; i < 3; i++) {
    const d = box(3.3, 0.07, 1.5, M.dark); d.position.y = -i * 0.22; deck.add(d);
    const mesh = box(3.1, 0.03, 1.3, M.yellow); mesh.position.y = -i * 0.22 + 0.05; deck.add(mesh);
  }
  for (const s of [-1, 1]) {
    const plate = box(3.4, 0.75, 0.08, M.steel); plate.position.set(0, -0.25, s * 0.79); deck.add(plate);
  }
  for (const s of [-1, 1]) {
    const motor = cyl(0.14, 0.14, 0.5, M.yellow); motor.rotation.z = Math.PI / 2;
    motor.position.set(0, 0.28, s * 0.9); deck.add(motor);
  }
  const feed = box(0.9, 0.6, 1.3, M.steel); feed.position.set(-1.9, 0.35, 0); deck.add(feed);
  deck.rotation.z = 0.30; deck.position.y = 1.9;
  g.add(deck);
  for (const [x, z] of [[-1.4, -0.8], [1.4, -0.8], [-1.4, 0.8], [1.4, 0.8]]) {
    const leg = box(0.12, 1.6, 0.12, M.dark); leg.position.set(x, 0.8, z); g.add(leg);
  }
  g.userData.deck = deck;
  return g;
}

/* штабель фракции */
function makeStockpile(r) {
  const g = new THREE.Group();
  const pile = new THREE.Mesh(new THREE.ConeGeometry(r, r * 0.85, 26), M.stone);
  pile.castShadow = true; pile.receiveShadow = true; pile.position.y = r * 0.425;
  g.add(pile);
  return g;
}

/* конвейер */
const conveyorMats = [];
function makeConveyor(from, to) {
  const g = new THREE.Group();
  const dir = new THREE.Vector3().subVectors(to, from);
  const len = dir.length(); dir.normalize();
  g.position.copy(new THREE.Vector3().addVectors(from, to).multiplyScalar(0.5));
  g.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), dir);
  const belt = box(0.55, 0.14, len, M.belt); g.add(belt);
  for (const s of [-1, 1]) { const rail = box(0.08, 0.3, len, M.steel); rail.position.x = s * 0.34; g.add(rail); }
  for (const s of [-1, 1]) {
    const p = cyl(0.15, 0.15, 0.66, M.dark); p.rotation.z = Math.PI / 2;
    p.position.z = s * len / 2; g.add(p);
  }
  const legs = new THREE.Group(); legs.position.set(0,0,0);
  for (const t of [0.28, 0.72]) {
    const wp = new THREE.Vector3().addVectors(g.position, dir.clone().multiplyScalar((t - 0.5) * len));
    const h = Math.max(wp.y - 0.25, 0.05);
    const leg = box(0.09, h, 0.09, M.dark);
    leg.position.set(wp.x, h / 2, wp.z);
    legs.add(leg);
  }
  const wrap = new THREE.Group();
  g.traverse(o => { if (o.isMesh) { o.material = o.material.clone(); o.material.transparent = true; conveyorMats.push(o.material); } });
  legs.traverse(o => { if (o.isMesh) { o.material = o.material.clone(); o.material.transparent = true; conveyorMats.push(o.material); } });
  wrap.add(g, legs);
  return wrap;
}

/* ---------- сборка линии ---------- */
const hopper = makeHopper();
const jaw = makeJaw();
const cone = makeCone();
const screen = makeScreen();

addNode(hopper, new THREE.Vector3(-12.5, 0, 0), new THREE.Vector3(-1.2, 1.4, -3.4),
  'Приёмный бункер', 'вибропитатель ZSW', 'Принимает сырьё с самосвалов и подаёт равномерным потоком в первичную дробилку.');
addNode(jaw, new THREE.Vector3(-7.5, 0, 0), new THREE.Vector3(-0.4, 3.2, 3.4),
  'Щековая дробилка PE-750×1060', 'первичное дробление', 'Грубое дробление гранита: с валуна до товарного куба, готовит поток под вторичную стадию.');
addNode(cone, new THREE.Vector3(-3, 0, 0), new THREE.Vector3(0.4, 5.0, -3.4),
  'Конусная дробилка DP-200', 'вторичное дробление', 'Дожимает материал до нужного размера: форма куба — это про неё.');
addNode(screen, new THREE.Vector3(1.8, 0, 0), new THREE.Vector3(1.2, 6.8, 3.4),
  'Грохот 3YZK1860', 'сортировка · 2–3 деки', 'Рассеивает поток на фракции: каждая дека — свой размер продукта.');

const stockData = [
  { pos: [8.2, 0, -2.7], r: 1.05, off: [0.6, 0, -1.4], label: '0–5 мм', spec: 'отсев' },
  { pos: [9.5, 0, -0.9], r: 1.2, off: [0.6, 0, -0.4], label: '5–20 мм', spec: 'товарная фракция' },
  { pos: [10.8, 0, 0.9], r: 1.35, off: [0.6, 0, 0.4], label: '20–40 мм', spec: 'товарная фракция' },
  { pos: [12.1, 0, 2.7], r: 1.05, off: [0.6, 0, 1.4], label: '40–70 мм', spec: 'балласт' },
];
const stockNodes = stockData.map(d => {
  const g = makeStockpile(d.r);
  return addNode(g, new THREE.Vector3(...d.pos), new THREE.Vector3(...d.off),
    'Штабель ' + d.label, d.spec, 'Готовый продукт ' + d.label + ' — отгружается заказчику прямо со штабеля.');
});

/* конвейеры: бункер→щека, щека→конус, конус→грохот, грохот→штабели */
const conv1 = makeConveyor(new THREE.Vector3(-12.5, 1.35, 2.0), new THREE.Vector3(-7.5, 3.1, 0.8));
const conv2 = makeConveyor(new THREE.Vector3(-7.5, 2.9, 0.8), new THREE.Vector3(-3, 3.6, 0.6));
const conv3 = makeConveyor(new THREE.Vector3(-3, 3.5, 0.6), new THREE.Vector3(0.4, 2.6, 0));
const convs = [conv1, conv2, conv3];
convs.forEach(c => scene.add(c));
for (let i = 0; i < 2; i++) {
  const c = makeConveyor(new THREE.Vector3(3.6, 3.1, i * 0.6 - 0.3), new THREE.Vector3(stockData[i + 1].pos[0] - 1.4, 2.4, stockData[i + 1].pos[2]));
  scene.add(c); convs.push(c);
}

/* ---------- подписи ---------- */
const tagsRoot = document.getElementById('tags');
nodes.forEach(n => {
  const el = document.createElement('div');
  el.className = 'tag';
  el.innerHTML = '<b>' + n.label + '</b><span>' + n.spec + '</span>';
  tagsRoot.appendChild(el);
  n.tag = el;
});

/* линии-выноски */
const leaderMats = [];
nodes.forEach(n => {
  const geo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(0, 0.85, 0)]);
  const mat = new THREE.LineBasicMaterial({ color: 0x17181a, transparent: true, opacity: 0 });
  const line = new THREE.Line(geo, mat);
  scene.add(line);
  n.leader = line; n.leaderMat = mat; leaderMats.push(mat);
});

/* ---------- поток камня ---------- */
const mainCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(-12.5, 3.4, 0.6),
  new THREE.Vector3(-9.9, 3.2, 0.9),
  new THREE.Vector3(-7.5, 2.9, 0.6),
  new THREE.Vector3(-5.2, 3.4, 0.6),
  new THREE.Vector3(-3, 3.6, 0.4),
  new THREE.Vector3(-0.9, 3.2, 0),
  new THREE.Vector3(0.6, 2.7, 0),
  new THREE.Vector3(3.4, 3.0, 0),
]);
const branchCurves = stockData.map(d =>
  new THREE.CatmullRomCurve3([
    new THREE.Vector3(3.6, 3.1, 0),
    new THREE.Vector3(5.6, 2.9, (d.pos[2]) * 0.4),
    new THREE.Vector3(d.pos[0] - 1.6, 2.6, d.pos[2] + 0.3),
    new THREE.Vector3(d.pos[0], d.r * 0.9, d.pos[2]),
  ]));
const curves = [mainCurve, ...branchCurves];
const weights = [0.55, 0.14, 0.13, 0.10, 0.08];

const P_COUNT = 190;
const particles = new THREE.InstancedMesh(
  new THREE.DodecahedronGeometry(0.085),
  new THREE.MeshStandardMaterial({ color: 0x7d766a, roughness: 1 }),
  P_COUNT
);
particles.castShadow = false;
scene.add(particles);

const pdata = [];
let acc = 0;
for (let i = 0; i < P_COUNT; i++) {
  acc += Math.random(); acc %= 1;
  let r = Math.random(), ci = 0, s = 0;
  for (let k = 0; k < weights.length; k++) { s += weights[k]; if (r <= s) { ci = k; break; } }
  pdata.push({ ci, t: acc, speed: 0.052 + Math.random() * 0.02 });
}
const dummy = new THREE.Object3D();

/* ---------- состояние ---------- */
let explodeT = 1;
let explodeTarget = 0;
let flowOn = true; // Поток камня включен по умолчанию
let flowAlpha = 0;
let slider = document.getElementById('explode');
let sliderHeld = false;
slider.addEventListener('pointerdown', () => sliderHeld = true);
addEventListener('pointerup', () => sliderHeld = false);
slider.addEventListener('input', () => { explodeTarget = slider.value / 100; });
const setSliderFill = () => slider.style.setProperty('--fill', slider.value + '%');

/* ---------- инфо-панель ---------- */
const info = document.getElementById('info');
const infoTitle = document.getElementById('infoTitle');
const infoText = document.getElementById('infoText');
let selected = null;
const selRing = new THREE.Mesh(
  new THREE.RingGeometry(2.0, 2.16, 48),
  new THREE.MeshBasicMaterial({ color: 0xf2c11b, transparent: true, opacity: 0, side: THREE.DoubleSide })
);
selRing.rotation.x = -Math.PI / 2; selRing.position.y = 0.02;
scene.add(selRing);

document.getElementById('infoClose').addEventListener('click', () => {
  info.classList.remove('show'); selected = null;
});

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let downAt = null;
renderer.domElement.addEventListener('pointerdown', e => downAt = [e.clientX, e.clientY]);
renderer.domElement.addEventListener('pointerup', e => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 6) return;
  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(nodes.map(n => n.group), true);
  if (hits.length) {
    selected = hits[0].object.userData.node;
    infoTitle.textContent = selected.label;
    infoText.textContent = selected.text;
    info.classList.add('show');
  } else {
    selected = null;
    info.classList.remove('show');
  }
});

/* ---------- resize ---------- */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  fitCamera();
  renderer.setSize(innerWidth, innerHeight);
});

/* ---------- цикл ---------- */
const v = new THREE.Vector3();
const ease = t => t * t * (3 - 2 * t);
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  explodeT += (explodeTarget - explodeT) * Math.min(1, dt * 3.2);
  if (Math.abs(explodeTarget - explodeT) < 0.002) explodeT = explodeTarget;
  if (!sliderHeld) { slider.value = Math.round(explodeT * 100); }
  setSliderFill();
  const t = ease(Math.min(1, Math.max(0, explodeT)));

  nodes.forEach(n => {
    n.group.position.copy(n.base).addScaledVector(n.off, t);
  });

  const fade = 1 - t;
  conveyorMats.forEach(m => m.opacity = 0.15 + 0.85 * fade);
  leaderMats.forEach(m => m.opacity = t * 0.55);
  const tagT = Math.min(1, Math.max(0, (t - 0.3) / 0.5));
  nodes.forEach(n => { n.tag.style.opacity = tagT; });

  if (selected) {
    selRing.position.x = selected.group.position.x;
    selRing.position.z = selected.group.position.z;
    selRing.material.opacity = 0.6 + Math.sin(clock.elapsedTime * 4) * 0.15;
  } else selRing.material.opacity = 0;

  const placed = [];
  const items = [];
  nodes.forEach(n => {
    n.group.getWorldPosition(v);
    const h = n.label.startsWith('Штабель') ? 1.7 : (n.group.userData.deck ? 3.1 : 3.6);
    v.y += h + 0.55;
    v.project(camera);
    if (v.z > 1) { n.tag.style.opacity = 0; return; }
    items.push({ n, x: (v.x * 0.5 + 0.5) * innerWidth, y: (-v.y * 0.5 + 0.5) * innerHeight });
    n.leader.position.set(n.group.position.x, n.group.position.y + (n.label.startsWith('Штабель') ? 1.2 : 3.4), n.group.position.z);
  });
  items.sort((a, b) => a.y - b.y);
  for (const it of items) {
    const el = it.n.tag;
    const w = el.offsetWidth || 160, h = el.offsetHeight || 44;
    let x = Math.min(Math.max(it.x, w / 2 + 8), innerWidth - w / 2 - 8);
    let y = Math.max(it.y, 74 + h);
    for (const p of placed) {
      if (Math.abs(x - p.x) < (w + p.w) / 2 + 6 && Math.abs(y - p.y) < (h + p.h) / 2 + 4) {
        y = p.y + (h + p.h) / 2 + 8;
      }
    }
    placed.push({ x, y, w, h });
    el.style.transform = `translate(-50%,-100%) translate(${x}px,${y}px)`;
  }

  flowAlpha += ((flowOn && t < 0.45 ? 1 : 0) - flowAlpha) * Math.min(1, dt * 4);
  const scale = flowAlpha;
  for (let i = 0; i < P_COUNT; i++) {
    const p = pdata[i];
    p.t += p.speed * dt;
    if (p.t > 1) p.t -= 1;
    const pos = curves[p.ci].getPoint(p.t);
    dummy.position.copy(pos);
    dummy.position.y += Math.sin(clock.elapsedTime * 6 + i) * 0.03;
    dummy.rotation.set(i, i * 2, 0);
    dummy.scale.setScalar(scale * (0.8 + (i % 5) * 0.1));
    dummy.updateMatrix();
    particles.setMatrixAt(i, dummy.matrix);
  }
  particles.instanceMatrix.needsUpdate = true;
  particles.visible = flowAlpha > 0.01;

  const wantY = 2 + t * 2.6;
  controls.target.y += (wantY - controls.target.y) * Math.min(1, dt * 1.6);

  controls.update();
  renderer.render(scene, camera);
}
animate();

    console.log('Получены настройки с сайта:', event.data);
  }
});
</script>
</body>
